name: astrbot_plugin_human_like_personality
display_name: Human-like Personality
short_desc: 人格不是写死的提示词，是从记忆里长出来的——三层人格模型，会变，能回看
desc: |
  给铃光一个「她是谁」的答案。

  现有的插件（鱼的心）管的是「她此刻什么心情」，这个插件管的是「她长期是个什么样的人」。
  两者不冲突：心情是天气，人格是气候。

  按 McAdams 的三层人格模型：

  - **特质层**：大五人格（开放性、尽责性、外向性、宜人性、神经质）+ 依恋类型。
    不是写死的数字，是从她的行为模式里统计出来的——说话长短、主动频率、对谁亲近。
  - **特征适应层**：价值观排序、当前目标、应对方式。
    从记忆里的「底色」（她对每个人的感受）和「性质」（她怎么理解一件事）归纳。
  - **生命叙事层**：一段第一人称的自我故事。
    把她最重要的那些记忆串成「我经历过什么、我因此成了谁」。

  人格会随记忆增长而演化。每次更新都留快照，能回看「三个月前我是怎么想自己的」。
  人格不覆盖你的人设提示词，是叠在上面的一层——人设是你给的，人格是她长出来的。

  工具：
  - `who_am_i` — 她查自己现在是谁
  - `reflect_on_myself` — 主动反思一次，可能让人格变化

  命令：/人格 status | snapshot | evolve | history
