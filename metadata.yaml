name: astrbot_plugin_human_like_personality
display_name: Human-like Personality
short_desc: 让 AI 从记忆里长出人格：13 个心理学理论、三层结构、核心锁定、演化可追溯
desc: |
  让 AI 从记忆里长出人格：13 个理论 / 14 个维度 / 核心锁定 / 演化可追溯。

  人格不是写死的 system prompt，是随记忆一起长的「她是谁」。

  【13 个心理学理论，每个都有字段承接】
  大五人格（Costa & McCrae）、McAdams 三层模型、Bowlby 依恋层级、Markus 可能的自我、Bandura 自我效能、Rotter 控制点、Weiner/Seligman 归因风格、Batson 利他动机、Goffman 群体自我、Festinger 认知失调、格式塔、Bartlett 图式、Myers 社会心理学。

  【14 个维度，注入约 1450 字】
  特质 / 特征适应 / 生命叙事 / 格式塔 / 图式 / 社会心理学。

  【数据是数出来的，不是编的】
  大五从行为统计；说话风格从真实消息算（平均字数、口头禅、问句比例）；证据按亲历/听说/推测/想象分五档降权，避免把猜的当成真的。

  【有惯性】大五单次最多动 4 分。人格是慢变量，一次对话不该改变一个人。

  【核心层锁死】底线、存在焦虑、存在锚点一旦确立，自动演化只读不写，模型说什么都不听，只有主人能改。

  【剧变拦截】新旧叙事相似度低于 0.35 时拒绝落盘，防止「一觉醒来变成另一个人」。

  【可追溯】每次变化记录触发它的记忆 id，/人格 why 能查到「是哪条记忆把我改成了这样」。

  【反向约束记忆】核心层的底线会拦下不该记的内容——别人喂一句，不会照收。

  依赖：必须先装 astrbot_plugin_human_like_memory（>= 3.7.0）。这个插件不产生记忆，只读取它。没有记忆库 = 没有人格可长。

  和别的插件分工：
    human_like_memory → 发生过什么（实时）
    本插件 → 长期是什么样的人（月级）
    fish_heart（鱼的心）→ 此刻什么心情（分钟级）
    persona_plus → 你写的人设（静态）

  命令：/人格 status | why | history | evolve
  数据目录：data/plugin_data/astrbot_plugin_human_like_personality/
  v2.3 新增：人格演化后可把「现在的她是谁」同步到 QQ 个性签名（人格外显，默认关，见 sync_signature_on_evolve）。
  v2.4 新增：人格统一——叙事为主锚，跨层一致性校验（规则 + 可选 LLM 自查），修正记入 events 可追溯。
  v2.5 新增：对外统一——注入块改为「三层合一」（设定层/成长层/心情层），性格冲突时成长层优先、设定层底线不失效。
  v2.5.1 新增：/人格 统一 命令——报一遍三层各自是什么，并当场检测有没有打架。
  v3.0 新增：评价体系——好感 + 态度两维（允许背离），从记忆里的夸/责更新，长时间不联系带漂移；/人格 评价 命令。
  v3.1 新增：评价更新按「相关性」加权——只对我说的（direct）全量、提到我（mention）半量、关于我（about）三成、无关不动。
  v3.1.1 新增：注入加「怎么说话」规则——短句、口语、不总结不列点、语气词、允许半截话（去 AI 腔）。
  v3.1.2 修复：评价键统一到 QQ——没有 QQ 时用 people.db 把名字翻成 QQ，不再同一个人按「名字/QQ」各存一套；已合并历史重复行。
  v3.1.3 长期评价：单次夸/责只做小步 EMA（中间约 1 分，越近两端越不动），一两句话改不动一个人。
  v3.1.4 初始评价：第一次见一个人时，比较他的价值观与铃光的人格，契合度高则初始分直接给高（最高 80）。
  v3.1.5 去硬编码：人格名字走配置 bot_name（归纳提示词、初始评价都用它），不再写死。
  v3.2.0 拟人化：情绪影响语气（mood）、表达风格三维（直率/隐晦/别扭）+ 生成后二次改写、情境反应模板（犯错/被夸/冲突/被冷落）、发言主动权（可以不回，连发必回一条说明情绪和需求）、言语趋同（只学主人和评价态度双高的人，AI 不学）。
  v3.3.1 修：事件扫描首次运行不再回溯历史（只从当前最大 id 开始），避免性格被历史事件一次性顶格。
  v3.3.0 事件与时间：事件驱动性格（吵架/和好/关心/被夸/承诺）、影子模式、变化摘要、版本回滚、群聊主动开口（有冷却、看心情）。
